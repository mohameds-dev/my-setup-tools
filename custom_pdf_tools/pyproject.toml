[project]
name = "custom-pdf-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed", email = "mosalah3480@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "img2pdf>=0.6.3",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
]

[project.scripts]
custom-pdf-tools = "custom_pdf_tools:main"
rasterize-pdf = "custom_pdf_tools:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
