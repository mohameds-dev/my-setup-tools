<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f7f7f8;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      background: #fff;
      border: 1px solid #e2e4e8;
      border-radius: 8px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #555;
    }

    input[type="file"],
    select,
    button {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d0d3d9;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      background: #fff;
    }

    input[type="file"] {
      cursor: pointer;
    }

    button {
      background: #111;
      color: #fff;
      border: none;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      opacity: 0.88;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #status {
      margin-top: 14px;
      font-size: 0.82rem;
      color: #666;
    }

    .info {
      margin-top: 14px;
      padding: 10px 12px;
      background: #f4f5f7;
      border-radius: 6px;
      font-size: 0.82rem;
      display: none;
      line-height: 1.5;
    }

    #preview {
      display: none;
      margin-top: 14px;
      max-width: 100%;
      max-height: 200px;
      border-radius: 4px;
      border: 1px solid #e2e4e8;
      object-fit: contain;
    }

    #downloadBtn {
      display: none;
      margin-top: 14px;
      text-align: center;
      background: #1a7f37;
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    #downloadBtn:hover {
      background: #14662c;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Image Resizer</h1>

    <form id="resizerForm" onsubmit="event.preventDefault(); resizeImage();">
      <div class="form-group">
        <label for="imageInput">Choose image</label>
        <input type="file" id="imageInput" accept="image/*" required>
      </div>

      <div class="form-group">
        <label for="targetSize">Target size</label>
        <select id="targetSize">
          <option value="1" selected>&lt; 1MB</option>
          <option value="5">&lt; 5MB</option>
          <option value="10">&lt; 10MB</option>
          <option value="20">&lt; 20MB</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">Resize</button>
    </form>

    <div id="status"></div>

    <div id="info" class="info">
      <div>Original: <span id="origInfo"></span></div>
      <div>Resized: <span id="resultInfo"></span></div>
    </div>

    <img id="preview" alt="Preview">

    <a id="downloadBtn" download="resized.jpg">Download Image</a>
  </main>

  <script>
    const fileInput = document.getElementById('imageInput');
    const targetSelect = document.getElementById('targetSize');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    const infoEl = document.getElementById('info');
    const origInfo = document.getElementById('origInfo');
    const resultInfo = document.getElementById('resultInfo');
    const downloadBtn = document.getElementById('downloadBtn');
    const preview = document.getElementById('preview');

    let currentUrl = null;

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      downloadBtn.style.display = 'none';
      preview.style.display = 'none';
      infoEl.style.display = 'none';
      statusEl.textContent = file ? `${file.name} (${formatSize(file.size)})` : '';
    });

    function canvasToBlob(canvas, quality) {
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
      });
    }

    async function resizeImage() {
      if (!fileInput.files || fileInput.files.length === 0) return;

      const file = fileInput.files[0];
      const targetMB = parseFloat(targetSelect.value);
      const maxBytes = Math.floor(targetMB * 1024 * 1024 * 0.98);

      submitBtn.disabled = true;
      downloadBtn.style.display = 'none';
      statusEl.textContent = 'Processing...';

      try {
        if (file.size <= maxBytes) {
          origInfo.textContent = formatSize(file.size);
          resultInfo.textContent = `${formatSize(file.size)} (already under limit)`;
          infoEl.style.display = 'block';

          if (currentUrl) URL.revokeObjectURL(currentUrl);
          currentUrl = URL.createObjectURL(file);

          preview.src = currentUrl;
          preview.style.display = 'block';

          downloadBtn.href = currentUrl;
          downloadBtn.download = file.name;
          downloadBtn.style.display = 'block';

          statusEl.textContent = 'File is already within selected target.';
          submitBtn.disabled = false;
          return;
        }

        const img = new Image();
        const initialUrl = URL.createObjectURL(file);

        await new Promise((resolve, reject) => {
          img.onload = () => resolve();
          img.onerror = () => reject(new Error('Failed to load image.'));
          img.src = initialUrl;
        });
        URL.revokeObjectURL(initialUrl);

        let width = img.naturalWidth;
        let height = img.naturalHeight;
        origInfo.textContent = `${formatSize(file.size)} (${width}x${height})`;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        let bestBlob = null;
        let scale = 1.0;

        for (let attempt = 0; attempt < 8; attempt++) {
          canvas.width = Math.round(width * scale);
          canvas.height = Math.round(height * scale);

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          let lowQuality = 0.45;
          let highQuality = 0.92;
          let candidate = null;

          for (let iter = 0; iter < 5; iter++) {
            const quality = (lowQuality + highQuality) / 2;
            const blob = await canvasToBlob(canvas, quality);

            if (blob.size <= maxBytes) {
              candidate = blob;
              lowQuality = quality;
            } else {
              highQuality = quality;
            }
          }

          if (candidate) {
            bestBlob = candidate;
            break;
          }

          scale *= 0.85;
        }

        if (!bestBlob) {
          bestBlob = await canvasToBlob(canvas, 0.40);
        }

        if (currentUrl) URL.revokeObjectURL(currentUrl);
        currentUrl = URL.createObjectURL(bestBlob);

        resultInfo.textContent = `${formatSize(bestBlob.size)} (${canvas.width}x${canvas.height})`;
        infoEl.style.display = 'block';

        preview.src = currentUrl;
        preview.style.display = 'block';

        const baseName = file.name.replace(/\.[^/.]+$/, "");
        downloadBtn.href = currentUrl;
        downloadBtn.download = `${baseName}-resized.jpg`;
        downloadBtn.style.display = 'block';

        statusEl.textContent = 'Done.';
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
